name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon setupCiWorkspace
          ./gradlew --no-daemon clean build -x test

      - uses: actions/upload-artifact@v4
        with:
          name: FDPClient-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Run tests
        continue-on-error: true
        run: ./gradlew --no-daemon test -i

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
          if-no-files-found: ignore
